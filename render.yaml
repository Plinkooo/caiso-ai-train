services:
  - type: web
    name: caiso-ai-train
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CACHE_TTL_SECONDS
        value: "600"
      - key: CACHE_MAXSIZE
        value: "256"
