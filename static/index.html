<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAISO Next 24h</title>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background: #0b1020; color: #e8eefc; }
    .wrap { max-width: 1300px; margin: 0 auto; padding: 18px; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; align-items: start; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    .card { padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); }
    .chart { height: 320px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    label { font-size: 12px; color: #a8b3d6; display: block; margin-bottom: 4px; }
    input { padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); color: #e8eefc; width: 140px; }
    button { padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); color: #e8eefc; cursor: pointer; }
    .muted { color: #a8b3d6; white-space: pre-wrap; }
    h2 { margin: 14px 0 6px; font-size: 16px; }
    .rightStack { display: grid; gap: 14px; }
    .metaLine { margin-top: 10px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="grid">

      <!-- LEFT: Charts -->
      <div style="display:grid; gap:14px;">
        <div class="card"><div id="chart1" class="chart"></div></div>
        <div class="card"><div id="chart2" class="chart"></div></div>
        <div class="card"><div id="chart3" class="chart"></div></div>
      </div>

      <!-- RIGHT: Modifiers + windows -->
      <div class="rightStack">

        <div class="card">
          <div class="row">
            <div>
              <label for="hours">Hours</label>
              <input id="hours" type="number" value="24" min="1" max="72" />
            </div>
            <div>
              <label for="q">Score quantile</label>
              <input id="q" type="number" value="0.2" step="0.05" min="0" max="1" />
            </div>
            <div>
              <label for="minDur">Min duration (min)</label>
              <input id="minDur" type="number" value="30" step="5" min="5" />
            </div>
            <div>
              <label for="maxDur">Max duration (min)</label>
              <input id="maxDur" type="number" placeholder="" step="5" min="5" />
            </div>
            <div>
              <label for="gw">Green weight</label>
              <input id="gw" type="number" value="0.7" step="0.05" min="0" max="1" />
            </div>
            <div>
              <label for="cw">Cheap weight</label>
              <input id="cw" type="number" value="0.3" step="0.05" min="0" max="1" />
            </div>
            <div style="margin-left:auto;">
              <button id="refreshBtn" type="button">Refresh</button>
            </div>
          </div>

          <div id="meta" class="muted metaLine"></div>
        </div>

        <div class="card">
          <h2 style="margin-top:0;">Green windows</h2>
          <div id="winGreen"></div>

          <h2>Cheap windows</h2>
          <div id="winCheap"></div>

          <h2>Both</h2>
          <div id="winBoth"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {

    function el(id) {
      var node = document.getElementById(id);
      if (!node) throw new Error("Missing element #" + id + " in HTML");
      return node;
    }

    function allMissing(arr) {
      return !arr || arr.length === 0 || arr.every(function (v) {
        return v === null || v === undefined || Number.isNaN(v);
      });
    }

    function buildShapes(windows) {
      if (!Array.isArray(windows)) return [];
      return windows.map(function (w) {
        return {
          type: "rect",
          xref: "x",
          yref: "paper",
          x0: w.start,
          x1: w.end,
          y0: 0,
          y1: 1,
          fillcolor: "rgba(90, 200, 140, 0.12)",
          line: { width: 0 }
        };
      });
    }

    function predictedShadeShape(meta) {
      if (!meta || !meta.forecast_cutoff_time || !meta.horizon_end) return null;
      return {
        type: "rect",
        xref: "x",
        yref: "paper",
        x0: meta.forecast_cutoff_time,
        x1: meta.horizon_end,
        y0: 0,
        y1: 1,
        fillcolor: "rgba(255, 80, 80, 0.07)",
        line: { width: 0 }
      };
    }

    function splitWithBoundary(x, y, isPred) {
      var n = x.length;
      var k = -1;
      for (var i = 0; i < n; i++) { if (isPred[i]) { k = i; break; } }

      if (k === -1) return { xF: x.slice(), yF: y.slice(), xP: [], yP: [] };
      if (k === 0)  return { xF: [], yF: [], xP: x.slice(), yP: y.slice() };

      var xF = x.slice(0, k);
      var yF = y.slice(0, k);

      var xP = [x[k - 1]].concat(x.slice(k));
      var yP = [y[k - 1]].concat(y.slice(k));

      return { xF: xF, yF: yF, xP: xP, yP: yP };
    }

    function renderMeta(meta) {
      var parts = [];
      if (meta && meta.horizon_start && meta.horizon_end) parts.push("Horizon: " + meta.horizon_start + " -> " + meta.horizon_end);
      if (meta && meta.horizon_hours) parts.push(String(meta.horizon_hours) + "h view");
      if (meta && meta.forecast_cutoff_hours && meta.forecast_cutoff_time) {
        parts.push("Forecast cutoff: " + meta.forecast_cutoff_hours + "h (" + meta.forecast_cutoff_time + ")");
      }
      parts.push("LMP: " + ((meta && meta.lmp_available) ? "available (ends at cutoff)" : "unavailable"));
      el("meta").textContent = parts.join(" | ");
    }

    function fmtDateTime(isoStr) {
      var d = new Date(isoStr);
      return d.toLocaleString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function fmtDuration(mins) {
      var m = Math.max(0, Math.round(mins));
      var h = Math.floor(m / 60);
      var r = m % 60;
      if (h === 0) return r + "m";
      if (r === 0) return h + "h";
      return h + "h " + r + "m";
    }

    function fmtStartsIn(isoStr) {
      var now = Date.now();
      var t = new Date(isoStr).getTime();
      var diffMin = Math.round((t - now) / 60000);

      if (diffMin < -1) return "started " + Math.abs(diffMin) + "m ago";
      if (diffMin <= 1) return "starting now";
      if (diffMin < 60) return "starts in " + diffMin + "m";

      var diffH = Math.round(diffMin / 60);
      if (diffH < 24) return "starts in " + diffH + "h";
      var diffD = Math.round(diffH / 24);
      return "starts in " + diffD + "d";
    }

    function isPredictedWindow(win, meta) {
      if (!meta || !meta.forecast_cutoff_time) return false;
      var cutoff = new Date(meta.forecast_cutoff_time).getTime();
      var start = new Date(win.start).getTime();
      return start > cutoff;
    }

    function windowsToHTML(wins, label, meta) {
      if (!wins || wins.length === 0) {
        return '<div class="muted">No ' + label + ' windows found. Try lowering the quantile or choosing a shorter minimum window.</div>';
      }

      var sorted = wins.slice().sort(function (a, b) {
        return new Date(a.start) - new Date(b.start);
      });

      var items = sorted.map(function (w) {
        var pred = isPredictedWindow(w, meta);
        var startTxt = fmtDateTime(w.start);
        var endTxt   = fmtDateTime(w.end);
        var durTxt   = fmtDuration(w.duration_minutes);
        var relTxt   = fmtStartsIn(w.start);

        var extras = [];
        if (w.avg_net_load !== null && Number.isFinite(w.avg_net_load)) {
          extras.push("Avg net load: <b>" + Math.round(w.avg_net_load).toLocaleString() + "</b> MW");
        }
        if (w.avg_score !== null && Number.isFinite(w.avg_score)) {
          extras.push("Avg score: <b>" + w.avg_score.toFixed(3) + "</b>");
        }

        var predPill = pred ? (
          '<div class="muted" style="' +
            'border: 1px solid rgba(255,80,80,0.35);' +
            'background: rgba(255,80,80,0.10);' +
            'color: #ffd6d6;' +
            'padding: 4px 8px;' +
            'border-radius: 999px;' +
            'font-size: 12px;' +
            'white-space: nowrap;' +
          '">Predicted</div>'
        ) : "";

        var extrasHtml = extras.length ? (
          '<div class="muted" style="margin-top:8px; display:flex; gap:14px; flex-wrap:wrap;">' +
            extras.map(function (x) { return "<div>" + x + "</div>"; }).join("") +
          "</div>"
        ) : "";

        return (
          '<div style="border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; padding: 10px 10px; background: rgba(255,255,255,0.03);">' +
            '<div style="display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap;">' +
              '<div>' +
                '<div style="font-weight:700;">' + startTxt + " -> " + endTxt + "</div>" +
                '<div class="muted" style="margin-top:4px;">' + relTxt + " \u2022 duration " + durTxt + "</div>" +
              "</div>" +
              predPill +
            "</div>" +
            extrasHtml +
          "</div>"
        );
      });

      return '<div style="display:grid; gap:10px; margin-top:8px;">' + items.join("") + "</div>";
    }

    async function loadData() {
      if (!window.Plotly) throw new Error("Plotly did not load. Check the CDN script tag.");

      var hours  = el("hours").value;
      var q      = el("q").value;
      var minDur = el("minDur").value;
      var maxDur = el("maxDur").value;
      var gw     = el("gw").value;
      var cw     = el("cw").value;

      // FIX: backend expects duration strings like "30min"
      var params = new URLSearchParams({
        hours: String(hours),
        score_quantile: String(q),
        min_duration: String(minDur) + "min",
        green_weight: String(gw),
        cheap_weight: String(cw)
      });
      if (maxDur) params.set("max_duration", String(maxDur) + "min");

      var res = await fetch("/api/next24?" + params.toString());
      if (!res.ok) {
        var txt = await res.text();
        el("meta").textContent = "API error: " + txt;
        throw new Error(txt);
      }

      var data = await res.json();
      renderMeta(data.meta);

      var s = data.series || [];
      var x = s.map(function (r) { return r.t_start; });

      var load  = s.map(function (r) { return (r.load_forecast_mw ?? NaN); });
      var ren   = s.map(function (r) { return (r.renewables_forecast_mw ?? NaN); });
      var net   = s.map(function (r) { return (r.net_load_forecast_mw ?? NaN); });

      var green = s.map(function (r) { return (r.green_score ?? NaN); });
      var cheap = s.map(function (r) { return (r.cheap_score ?? NaN); });
      var combo = s.map(function (r) { return (r.combined_score ?? NaN); });

      var lmp   = s.map(function (r) { return (r.lmp_usd_per_mwh ?? NaN); });
      var isPred = s.map(function (r) { return !!r.is_predicted; });

      var winShapes = buildShapes(data.windows || []);
      var predShade = predictedShadeShape(data.meta);
      var shapes = predShade ? [predShade].concat(winShapes) : winShapes;

      var loadSeg = splitWithBoundary(x, load, isPred);
      var renSeg  = splitWithBoundary(x, ren,  isPred);
      var netSeg  = splitWithBoundary(x, net,  isPred);

      Plotly.newPlot("chart1", [
        { x: loadSeg.xF, y: loadSeg.yF, name: "Load", mode: "lines" },
        { x: loadSeg.xP, y: loadSeg.yP, name: "Load (predicted)", mode: "lines", line: { color: "rgba(255, 140, 140, 0.95)" } },
        { x: renSeg.xF,  y: renSeg.yF,  name: "Renewables", mode: "lines" },
        { x: renSeg.xP,  y: renSeg.yP,  name: "Renewables (predicted)", mode: "lines", line: { color: "rgba(255, 170, 170, 0.95)" } },
        { x: netSeg.xF,  y: netSeg.yF,  name: "Net load", mode: "lines" },
        { x: netSeg.xP,  y: netSeg.yP,  name: "Net load (predicted)", mode: "lines", line: { color: "rgba(255, 110, 110, 0.95)" } }
      ], {
        title: "Forecast (Load / Renewables / Net Load) - predicted region shaded",
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: "#e8eefc" },
        xaxis: { showgrid: false, zeroline: false },
        yaxis: { title: "MW", gridcolor: "rgba(34,48,85,0.55)" },
        margin: { l: 55, r: 18, t: 42, b: 45 },
        shapes: shapes
      }, { displayModeBar: false, responsive: true });

      var scoreAnnotations = [];
      if (allMissing(cheap)) {
        scoreAnnotations.push({
          xref: "paper", yref: "paper",
          x: 0.01, y: 0.98, xanchor: "left", yanchor: "top",
          text: "Cheap score unavailable (no LMP data).",
          showarrow: false,
          font: { size: 12, color: "#a8b3d6" }
        });
      }

      Plotly.newPlot("chart2", [
        { x: x, y: green, name: "Green score", mode: "lines" },
        { x: x, y: cheap, name: "Cheap score", mode: "lines" },
        { x: x, y: combo, name: "Combined score", mode: "lines" }
      ], {
        title: "Scores (higher is better)",
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: "#e8eefc" },
        xaxis: { showgrid: false, zeroline: false },
        yaxis: { range: [0, 1], gridcolor: "rgba(34,48,85,0.55)" },
        margin: { l: 55, r: 18, t: 42, b: 45 },
        shapes: winShapes,
        annotations: scoreAnnotations
      }, { displayModeBar: false, responsive: true });

      var priceAnnotations = [];
      if (allMissing(lmp)) {
        priceAnnotations.push({
          xref: "paper", yref: "paper",
          x: 0.5, y: 0.5, xanchor: "center", yanchor: "middle",
          text: "LMP price data unavailable right now.",
          showarrow: false,
          font: { size: 14, color: "#a8b3d6" }
        });
      }

      Plotly.newPlot("chart3", [
        { x: x, y: lmp, name: "LMP ($/MWh)", mode: "lines" }
      ], {
        title: "Price (LMP) - cuts off when market data ends",
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: "#e8eefc" },
        xaxis: { showgrid: false, zeroline: false },
        yaxis: { title: "$/MWh", gridcolor: "rgba(34,48,85,0.55)" },
        margin: { l: 55, r: 18, t: 42, b: 45 },
        shapes: winShapes,
        annotations: priceAnnotations
      }, { displayModeBar: false, responsive: true });

      el("winGreen").innerHTML = windowsToHTML(data.windows_green, "green", data.meta);
      el("winCheap").innerHTML = windowsToHTML(data.windows_cheap, "cheap", data.meta);
      el("winBoth").innerHTML  = windowsToHTML(data.windows_both, "both", data.meta);
    }

    function showErr(err) {
      console.error(err);
      try { el("meta").textContent = "Error: " + String(err && err.message ? err.message : err); } catch (e) {}
    }

    el("refreshBtn").addEventListener("click", function () { loadData().catch(showErr); });
    loadData().catch(showErr);
  });
  </script>
</body>
</html>
