<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CAISO Train Windows (Green + Cheap)</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    body { font-family: system-ui, Arial; margin: 24px; background: #0b1220; color: #e8eefc; }
    h1 { margin: 0 0 6px 0; font-size: 20px; }
    .muted { color: #a8b3d6; font-size: 13px; line-height: 1.4; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #cdd6f6; }
    input, select {
      padding: 7px 9px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25); color: #e8eefc;
      min-width: 120px;
    }
    input.small { min-width: 90px; width: 90px; }
    button {
      padding: 9px 12px; cursor: pointer; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08); color: #e8eefc;
    }

    .layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; margin-top: 12px; align-items: start; }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

    .charts { display: grid; gap: 12px; }
    #chart1, #chart2, #chart3 { height: 320px; }

    .sidebar { display: grid; gap: 12px; }
    ul { margin: 8px 0 0 18px; }
    .metaLine { margin-top: 6px; }
  </style>
</head>
<body>
  <div class="row" style="justify-content: space-between;">
    <div>
      <h1>CAISO Energy Usage</h1>
      <div class="muted">Forecast-based on green and cheap signals, with recommended windows.</div>
      <div id="meta" class="muted metaLine"></div>
    </div>
  </div>

  <div class="layout">
    <div class="charts">
      <div class="card"><div id="chart1"></div></div>
      <div class="card"><div id="chart2"></div></div>
      <div class="card"><div id="chart3"></div></div>
    </div>

    <div class="sidebar">
      <div class="card">
        <div class="row">
          <label>Horizon
            <select id="hours">
              <option value="24" selected>24 hours</option>
              <option value="48">48 hours</option>
              <option value="72">72 hours (Less reliable)</option>
            </select>
          </label>

          <label>Top quantile
            <input id="q" type="number" step="0.01" min="0.50" max="0.95" value="0.80" />
          </label>

          <label>Min window
            <select id="minDur">
              <option value="30min">30 min</option>
              <option value="60min" selected>60 min</option>
              <option value="120min">2 hours</option>
            </select>
          </label>

          <label>Max window (optional)
            <select id="maxDur">
              <option value="">No max</option>
              <option value="180min">3 hours</option>
              <option value="360min">6 hours</option>
              <option value="720min">12 hours</option>
            </select>
          </label>

          <label>Green weight
            <input id="gw" class="small" type="number" step="0.1" min="0" max="1" value="0.5">
          </label>

          <label>Cheap weight
            <input id="cw" class="small" type="number" step="0.1" min="0" max="1" value="0.5">
          </label>

          <button onclick="loadData()">Refresh</button>
        </div>
      </div>

      <div class="card">
        <div><b>Recommended windows</b> <span class="muted">(Green / Cheap / Both)</span></div>

        <div style="margin-top:10px;">
          <div><b>Green</b></div>
          <div id="winGreen" class="muted"></div>
        </div>

        <div style="margin-top:10px;">
          <div><b>Cheap</b></div>
          <div id="winCheap" class="muted"></div>
        </div>

        <div style="margin-top:10px;">
          <div><b>Both (intersection)</b></div>
          <div id="winBoth" class="muted"></div>
        </div>
      </div>
    </div>
  </div>

<script>
function allMissing(arr) {
  return !arr || arr.length === 0 || arr.every(v => v === null || v === undefined || Number.isNaN(v));
}

function buildShapes(windows) {
  if (!Array.isArray(windows)) return [];
  return windows.map(w => ({
    type: "rect",
    xref: "x",
    yref: "paper",
    x0: w.start,
    x1: w.end,
    y0: 0,
    y1: 1,
    fillcolor: "rgba(90, 200, 140, 0.12)",
    line: { width: 0 }
  }));
}

function renderMeta(meta) {
  const parts = [];
  if (meta.horizon_start && meta.horizon_end) parts.push(`Horizon: ${meta.horizon_start} → ${meta.horizon_end}`);
  if (meta.horizon_hours) parts.push(`${meta.horizon_hours}h view`);
  if (meta.forecast_cutoff_hours && meta.forecast_cutoff_time) {
    parts.push(`Forecast cutoff: ${meta.forecast_cutoff_hours}h (${meta.forecast_cutoff_time})`);
  }
  if (meta.training_days) parts.push(`Training: ${meta.training_days}d`);
  if (meta.ridge_cached_ttl_seconds) parts.push(`Ridge retrain max: ${meta.ridge_cached_ttl_seconds}s`);
  parts.push(`LMP: ${meta.lmp_available ? "available (cuts off at cutoff)" : "unavailable"}`);
  document.getElementById("meta").textContent = parts.join(" | ");
}

function windowsToHTML(wins, label) {
  if (!wins || wins.length === 0) return `No ${label} windows found (try lowering quantile or min window).`;
  return "<ul>" + wins.map(w => (
    `<li><b>${w.start}</b> → <b>${w.end}</b> (${w.duration_minutes} min)` +
    (w.avg_net_load !== null && Number.isFinite(w.avg_net_load) ? ` | avg net load ${w.avg_net_load.toFixed(0)}` : "") +
    (w.avg_score !== null && Number.isFinite(w.avg_score) ? ` | avg score ${w.avg_score.toFixed(3)}` : "") +
    `</li>`
  )).join("") + "</ul>";
}

function splitByPredicted(x, y, isPred) {
  const xA = [], yA = [], xP = [], yP = [];
  for (let i = 0; i < x.length; i++) {
    if (isPred[i]) { xP.push(x[i]); yP.push(y[i]); }
    else { xA.push(x[i]); yA.push(y[i]); }
  }
  return { xA, yA, xP, yP };
}

async function loadData() {
  const hours = document.getElementById("hours").value;
  const q = document.getElementById("q").value;
  const minDur = document.getElementById("minDur").value;
  const maxDur = document.getElementById("maxDur").value;
  const gw = document.getElementById("gw").value;
  const cw = document.getElementById("cw").value;

  const params = new URLSearchParams({
    hours: hours,
    score_quantile: q,
    min_duration: minDur,
    green_weight: gw,
    cheap_weight: cw,
  });
  if (maxDur) params.set("max_duration", maxDur);

  const res = await fetch(`/api/next24?${params.toString()}`);
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(txt);
  }
  const data = await res.json();
  renderMeta(data.meta);

  const s = data.series || [];
  const x = s.map(r => r.t_start);

  const load = s.map(r => (r.load_forecast_mw ?? NaN));
  const ren  = s.map(r => (r.renewables_forecast_mw ?? NaN));
  const net  = s.map(r => (r.net_load_forecast_mw ?? NaN));

  const green = s.map(r => (r.green_score ?? NaN));
  const cheap = s.map(r => (r.cheap_score ?? NaN));
  const combo = s.map(r => (r.combined_score ?? NaN));

  const lmp = s.map(r => (r.lmp_usd_per_mwh ?? NaN));
  const isPred = s.map(r => !!r.is_predicted);

  const shapes = buildShapes(data.windows || []);

  // Split predicted vs forecast for chart 1
  const loadSplit = splitByPredicted(x, load, isPred);
  const renSplit  = splitByPredicted(x, ren,  isPred);
  const netSplit  = splitByPredicted(x, net,  isPred);

  Plotly.newPlot("chart1", [
    { x: loadSplit.xA, y: loadSplit.yA, name: "Load (forecast)", mode: "lines" },
    { x: loadSplit.xP, y: loadSplit.yP, name: "Load (predicted)", mode: "lines", line: { dash: "dot" } },

    { x: renSplit.xA,  y: renSplit.yA,  name: "Renewables (forecast)", mode: "lines" },
    { x: renSplit.xP,  y: renSplit.yP,  name: "Renewables (predicted)", mode: "lines", line: { dash: "dot" } },

    { x: netSplit.xA,  y: netSplit.yA,  name: "Net load (forecast)", mode: "lines" },
    { x: netSplit.xP,  y: netSplit.yP,  name: "Net load (predicted)", mode: "lines", line: { dash: "dot" } },
  ], {
    title: "Forecast (Load / Renewables / Net Load) - predicted beyond cutoff",
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: "#e8eefc" },
    xaxis: { showgrid: false, zeroline: false },
    yaxis: { title: "MW", gridcolor: "rgba(34,48,85,0.55)" },
    margin: { l: 55, r: 18, t: 42, b: 45 },
    shapes
  }, { displayModeBar: false, responsive: true });

  const scoreAnnotations = [];
  if (allMissing(cheap)) {
    scoreAnnotations.push({
      xref: "paper", yref: "paper",
      x: 0.01, y: 0.98, xanchor: "left", yanchor: "top",
      text: "Cheap score unavailable (no LMP data).",
      showarrow: false,
      font: { size: 12, color: "#a8b3d6" }
    });
  }

  Plotly.newPlot("chart2", [
    { x, y: green, name: "Green score", mode: "lines" },
    { x, y: cheap, name: "Cheap score", mode: "lines" },
    { x, y: combo, name: "Combined score", mode: "lines" },
  ], {
    title: "Scores (higher is better)",
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: "#e8eefc" },
    xaxis: { showgrid: false, zeroline: false },
    yaxis: { range: [0, 1], gridcolor: "rgba(34,48,85,0.55)" },
    margin: { l: 55, r: 18, t: 42, b: 45 },
    shapes,
    annotations: scoreAnnotations
  }, { displayModeBar: false, responsive: true });

  // LMP chart: backend returns null after cutoff, so it naturally stops
  const priceAnnotations = [];
  if (allMissing(lmp)) {
    priceAnnotations.push({
      xref: "paper", yref: "paper",
      x: 0.5, y: 0.5, xanchor: "center", yanchor: "middle",
      text: "LMP price data unavailable right now.",
      showarrow: false,
      font: { size: 14, color: "#a8b3d6" }
    });
  } else {
    priceAnnotations.push({
      xref: "paper", yref: "paper",
      x: 0.01, y: 0.98, xanchor: "left", yanchor: "top",
      text: "LMP shown only where market data exists (cuts off at cutoff).",
      showarrow: false,
      font: { size: 12, color: "#a8b3d6" }
    });
  }

  Plotly.newPlot("chart3", [
    { x, y: lmp, name: "LMP ($/MWh)", mode: "lines" }
  ], {
    title: "Price (LMP) - cuts off when market data ends",
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: "#e8eefc" },
    xaxis: { showgrid: false, zeroline: false },
    yaxis: { title: "$/MWh", gridcolor: "rgba(34,48,85,0.55)" },
    margin: { l: 55, r: 18, t: 42, b: 45 },
    shapes,
    annotations: priceAnnotations
  }, { displayModeBar: false, responsive: true });

  document.getElementById("winGreen").innerHTML = windowsToHTML(data.windows_green, "green");
  document.getElementById("winCheap").innerHTML = windowsToHTML(data.windows_cheap, "cheap");
  document.getElementById("winBoth").innerHTML = windowsToHTML(data.windows_both, "both");
}

loadData().catch(err => {
  console.error(err);
  document.getElementById("meta").textContent = "Error loading data - check /api/next24 and Render logs.";
});
</script>
</body>
</html>
